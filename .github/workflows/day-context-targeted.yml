name: Race Control · contexte du jour ciblé
on:
  push:
    branches: [feat/day-context-destination-car]
    paths: ['src/**', 'tests/**', '.github/workflows/day-context-targeted.yml']
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Vrais taps, contextes, profils, reload
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/run-ci.js --lane browser --suite e2e55-day-context.js --suite e2e53-global-context.js --suite e2e50-geolocation.js --suite e2e31.js --suite e2e32.js --suite e2e42-meteo.js --suite e2e39-layout.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: day-context-${{ matrix.browser }}
          path: |
            .ci/results/
            .ci/work/*/out/*.log
            .ci/work/*/out/day-context-*.png
          if-no-files-found: error
          retention-days: 3
      - name: Réouverture PWA réelle hors ligne
        if: always() && matrix.browser == 'chromium'
        env:
          BROWSER: chromium
        run: node tests/run-ci.js --lane browser --suite e2e54-context-sw.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.browser == 'chromium'
        with:
          name: day-context-pwa
          path: |
            .ci/results/
            .ci/work/*/out/*.log
          if-no-files-found: error
          retention-days: 3
