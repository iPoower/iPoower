name: FORTRESS - independent Python HTTP verification
on:
  pull_request:
    branches: [audit/fortress-corrected-publication-20261027]
    paths:
      - .github/workflows/fortress-python-http-verifier.yml
      - tests/verify_fortress_release.py
permissions:
  contents: read
jobs:
  verify-published-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run independent pinned-manifest HTTP verifier
        shell: bash
        run: |
          set -o pipefail
          python3 tests/verify_fortress_release.py --http-only | tee fortress-python-http-proof.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-python-http-proof
          path: fortress-python-http-proof.json
          if-no-files-found: error
          retention-days: 14
