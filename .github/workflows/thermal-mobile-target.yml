name: Race Control · thermique mobile ciblé
on:
  push:
    branches: [fix/pr44-thermal-mobile-label]
    paths: ['src/tyrelab.js', 'tests/test_tyrelab.js', 'tests/e2e43-analyse.js', '.github/workflows/thermal-mobile-target.yml']
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: mkdir -p .ci/thermal-target-proof
      - name: Analyse, cas mobile marginal et contrôle des autres vues
        env:
          BROWSER: ${{ matrix.browser }}
          LAB_SHOT: ${{ github.workspace }}/.ci/thermal-target-proof/analyse-${{ matrix.browser }}
        run: node tests/run-ci.js --lane browser --suite e2e43-analyse.js
      - name: Preuves fictives, aucune donnée ni clé personnelle
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thermal-mobile-target-${{ matrix.browser }}
          path: |
            .ci/thermal-target-proof/
            .ci/results/report-*.json
            .ci/work/**/e2e43-analyse.log
          if-no-files-found: error
          retention-days: 3
