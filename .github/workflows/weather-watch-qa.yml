name: Race Control · QA Weather Watch
# Retour rapide sur le nouveau module ; la matrice complète ci.yml reste obligatoire.
# Préréglage et clés fictifs, réseau extérieur bloqué, aucune publication ni secret.
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/weather-watch-qa.yml']
permissions:
  contents: read
jobs:
  station-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Dépendances reproductibles
        run: npm ci --no-audit --no-fund
      - name: Navigateur borné
        # Mêmes essais bornés que ci.yml, avec attente du verrou dpkg (22/10 : deux échecs sans un test).
        timeout-minutes: 20
        run: bash tools/ci-browser-install.sh ${{ matrix.browser }}
      - name: Station PC et iPhone, fixtures uniquement
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/run-ci.js --lane browser --suite e2e74-weather-watch.js
      - name: Captures et rapport Weather Watch fictifs
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-watch-${{ matrix.browser }}
          path: |
            .ci/work/*/out/weather-watch-*.png
            .ci/work/*/out/weather-watch-*.json
            .ci/work/*/out/e2e74-weather-watch.log
          if-no-files-found: error
          retention-days: 14
