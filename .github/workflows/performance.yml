name: Race Control · profilage comparatif
on:
  pull_request:
    paths: ['src/**', 'tools/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/performance.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    concurrency:
      group: performance-${{ github.ref }}-${{ matrix.browser }}
      cancel-in-progress: true
    steps:
      - name: Source avant (base immuable de la PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Source après (head immuable de la PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Dépendances existantes exactes
        working-directory: candidate
        run: npm ci --no-audit --no-fund
      - name: Navigateur borné
        working-directory: candidate
        timeout-minutes: 7
        env:
          PERF_BROWSER: ${{ matrix.browser }}
        run: timeout 360 npx playwright install --with-deps "$PERF_BROWSER"
      - name: Mesures comparables et fictives seulement
        env:
          BROWSER: ${{ matrix.browser }}
          NODE_PATH: ${{ github.workspace }}/candidate/node_modules
        run: node candidate/tests/perf-compare.js --baseline baseline --candidate candidate --out "perf-out/report-$BROWSER.json"
      - name: Rapport sans captures, configuration ni URL personnelle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.browser }}
          path: perf-out/report-*.json
          if-no-files-found: error
          retention-days: 14
