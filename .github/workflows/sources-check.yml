name: Race Control · contrôle des sources
# Étape 0 : aucune donnée personnelle dans le dépôt, et le build depuis les sources redonne exactement la version en production.
# Lancé à la main (Run workflow, depuis main) : vérifie aussi que les fichiers en ligne s'ouvrent avec la bonne clé.
# Ne déploie rien.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'tests/**', 'encrypted/**', 'package.json', 'package-lock.json', '.github/workflows/sources-check.yml', '.github/workflows/race-control.yml', '.github/workflows/race-control-watchdog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # frontière GitHub : secrets dans l'Environment « production », accessible uniquement depuis main (règle côté GitHub,
    # indépendante de ce fichier) ; deployment: false = aucune entrée de déploiement créée
    environment:
      name: production
      deployment: false
    # frontière des secrets : uniquement depuis main (jamais lancé depuis une autre branche)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Aucune donnée personnelle dans le dépôt
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
        run: node tools/check-secrets.js
      - name: Séparation des clés (dépôt)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
        run: node tools/check-keys.js
      - name: Build depuis les sources (fichiers chiffrés seuls, aucun secret)
        run: node tools/build.js
      - name: Identique à la production
        run: |
          git fetch --depth 1 origin gh-pages
          for f in index.html engine.js relay.js sw.js widget.js tiredb.json manifest.webmanifest relay-config.sealed.json; do
            git show origin/gh-pages:race-control/$f > /tmp/prod_$f
            if cmp -s dist/$f /tmp/prod_$f; then echo "identique : $f"; else echo "::warning::$f diffère de la production (normal si une modification n'est pas encore publiée)"; fi
          done
      # lancement manuel uniquement (après un changement de secret) : les fichiers EN LIGNE s'ouvrent avec la bonne clé
      - name: Séparation des clés (production)
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
        run: |
          mkdir -p /tmp/prod
          for f in relay-config.sealed.json calendar.sealed.json; do git show origin/gh-pages:race-control/$f > /tmp/prod/$f 2>/dev/null || rm -f /tmp/prod/$f; done
          node tools/check-keys.js --prod /tmp/prod
