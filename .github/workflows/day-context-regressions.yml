name: Day context · régressions ciblées
on:
  push:
    branches: [verify/day-context-ci-9a1da9e]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Tests ciblés sur fixtures uniquement fictives
        env:
          BROWSER: ${{ matrix.browser }}
          LAB_DUMP: '1'
          LAB_SHOT: /tmp/day-context-analyse
        run: node tests/run-ci.js --lane browser --suite e2e43-analyse.js --suite e2e44-place.js --suite e2e49-interactions.js --suite e2e55-day-context.js --suite e2e42-meteo.js
      - name: Diagnostic fictif
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: day-regressions-${{ matrix.browser }}
          path: |
            .ci/results/report-*.json
            .ci/work/*/out/*.log
            /tmp/day-context-analyse-*.png
          if-no-files-found: error
          retention-days: 1
