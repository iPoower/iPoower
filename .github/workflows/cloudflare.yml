name: Race Control · origine dédiée Cloudflare
# Workflow SÉPARÉ de ci.yml : le relais n'accepte que les CI ci.yml vertes (tools/relay-trust.js).
# Un échec de publication ou de vérification Cloudflare ne peut donc jamais bloquer le relais.
# Déclenché après une CI de main réussie ; ne publie que l'application que gh-pages sert déjà :
# même identité de build que gh-pages/race-control/version.json, sinon s'arrête sans rien faire.
# gh-pages ne republie que si le build change : le commit servi peut être antérieur à main.
# INACTIF tant que la variable CLOUDFLARE_RC_PROJECT n'existe pas. Environnement production, limité à main.
# Ne JAMAIS exiger d'approbation sur production : relais, watchdog et confidentialité l'utilisent (incident du 22/10).
# Les données du relais restent servies par gh-pages (CORS). L'ancienne PWA n'est ni redirigée ni modifiée.
# Limite : un retour arrière lancé à la main sur ci.yml ne republie pas Cloudflare.
on:
  workflow_run:
    workflows: ['Race Control · tests']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: race-control-cloudflare
  cancel-in-progress: false
jobs:
  deploy-cloudflare:
    if: >-
      vars.CLOUDFLARE_RC_PROJECT != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.CLOUDFLARE_RC_PROJECT }}.pages.dev
    env:
      SRC_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: Application servie par gh-pages
        id: live
        run: |
          v=pages/race-control/version.json
          if ! node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!Number.isSafeInteger(j.run)||j.run<1||!/^[0-9a-f]{40}$/.test(j.sha||"")||!/^[0-9a-f]{12}$/.test(j.build||""))process.exit(1);process.stdout.write("run="+j.run+"\nsha="+j.sha+"\nbuild="+j.build+"\n")' "$v" >> "$GITHUB_OUTPUT"; then
            echo "::notice title=Cloudflare inchangé::version.json de gh-pages illisible : rien à republier."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.live.outputs.go == '1'
        with:
          node-version: 24
      - name: Build pour l'origine dédiée (données du relais lues sur gh-pages)
        id: build
        if: steps.live.outputs.go == '1'
        env:
          RC_DATA_BASE: https://ipoower.github.io/iPoower/race-control/
          RC_OUT: dist-cloudflare
          GOOGLE_DRIVE_CONFIG: ${{ vars.GOOGLE_DRIVE_CONFIG }}
          LIVE_RUN: ${{ steps.live.outputs.run }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          LIVE_BUILD: ${{ steps.live.outputs.build }}
        run: |
          node tools/build.js
          for f in obs.json calendar.sealed.json road-datex.json; do [ ! -e "dist-cloudflare/$f" ] || { echo "::error::Donnée du relais dans le build"; exit 1; }; done
          build=$(sed -nE 's/.*window\.TWRC_BUILD="([^"]+)".*/\1/p' dist-cloudflare/index.html | head -1)
          # Identité de build (application hors base de données) : celle que gh-pages sert, sinon rien.
          if [ "$build" != "$LIVE_BUILD" ]; then
            echo "::notice title=Cloudflare inchangé::build $build ≠ build servi par gh-pages $LIVE_BUILD : rien à republier."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Même numéro et même commit que gh-pages (Réglages → Version identique sur les deux origines).
          node -e 'require("fs").writeFileSync("dist-cloudflare/version.json", JSON.stringify({ run: +process.env.LIVE_RUN, sha: process.env.LIVE_SHA, at: new Date().toISOString(), build: process.argv[1] }))' "$build"
          sha256sum dist-cloudflare/index.html dist-cloudflare/sw.js dist-cloudflare/manifest.webmanifest
          echo "go=1" >> "$GITHUB_OUTPUT"
      # Chaîne d'approvisionnement : wrangler et TOUTES ses dépendances viennent de tools/cloudflare/package-lock.json (empreintes
      # d'intégrité), installés sans exécuter aucun script et SANS jeton dans l'environnement. Le jeton n'est donné qu'au binaire local.
      - name: Outil d'envoi verrouillé (lockfile, aucun script, aucun jeton)
        if: steps.build.outputs.go == '1'
        run: |
          npm ci --prefix tools/cloudflare --ignore-scripts --no-audit --no-fund
          [ "$(tools/cloudflare/node_modules/.bin/wrangler --version | tail -1)" = "4.168.0" ] || { echo "::error::wrangler inattendu"; exit 1; }
      - name: Projet en envoi direct (créé une seule fois, sans connexion Git)
        if: steps.build.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_RC_PROJECT }}
        run: |
          set -o pipefail
          # une erreur de l'API (réseau, droits) arrête tout : jamais de création « à l'aveugle »
          list=$(tools/cloudflare/node_modules/.bin/wrangler pages project list)
          if printf '%s\n' "$list" | grep -qwF -- "$PROJECT"; then echo "Projet existant."
          else tools/cloudflare/node_modules/.bin/wrangler pages project create "$PROJECT" --production-branch main; fi
      - name: Envoi direct vers Cloudflare Pages
        if: steps.build.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_RC_PROJECT }}
        run: tools/cloudflare/node_modules/.bin/wrangler pages deploy dist-cloudflare --project-name "$PROJECT" --branch main --commit-hash "$SRC_SHA" --commit-dirty=false
      - name: Octets servis, commit exact et en-têtes HTTP réellement reçus
        if: steps.build.outputs.go == '1'
        env:
          PROJECT: ${{ vars.CLOUDFLARE_RC_PROJECT }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          url="https://$PROJECT.pages.dev"
          c() { curl -fsS --connect-timeout 10 --max-time 30 "$@"; }
          for i in $(seq 1 18); do
            served=$(c "$url/version.json?v=$GITHUB_RUN_ID$i" | sed -nE 's/.*"sha":"([0-9a-f]+)".*/\1/p' || true)
            [ "$served" = "$LIVE_SHA" ] && break; sleep 10
          done
          [ "$served" = "$LIVE_SHA" ] || { echo "::error::L'origine dédiée ne sert pas $LIVE_SHA"; exit 1; }
          # version.json peut déjà nommer ce commit avant la fin de propagation (même commit republié) : les octets sont relus
          # jusqu'à 3 min avant de conclure. Pages redirige /index.html vers / et /recovery.html vers /recovery : relus à leur vraie adresse.
          for f in index.html recovery.html sw.js manifest.webmanifest drive-config.json; do
            p="$f"; [ "$f" = index.html ] && p=""; [ "$f" = recovery.html ] && p="recovery"
            want=$(sha256sum "dist-cloudflare/$f" | cut -d' ' -f1); got=""
            for i in $(seq 1 18); do got=$(c "$url/$p?v=$GITHUB_RUN_ID$i" | sha256sum | cut -d' ' -f1); [ "$got" = "$want" ] && break; sleep 10; done
            [ "$got" = "$want" ] || { echo "::error::$f servi différent du build"; exit 1; }
          done
          # En-têtes : chaque ligne du bloc « /* » de _headers doit être reçue À L'IDENTIQUE (valeur exacte, ligne entière).
          # COOP vaut same-origin-allow-popups avec Drive, same-origin sans : la valeur attendue est celle du build, jamais un préfixe.
          expected=$(awk '/^\/\*$/{on=1;next} /^\//{on=0} on && /^  /{sub(/^  /,""); print}' dist-cloudflare/_headers)
          [ "$(printf '%s\n' "$expected" | grep -c .)" -ge 8 ] || { echo "::error::_headers du build illisible"; exit 1; }
          for path in / /sw.js /manifest.webmanifest /recovery; do
            headers=$(c -I "$url$path" | tr -d '\r')
            while IFS= read -r h; do
              [ -n "$h" ] || continue
              printf '%s\n' "$headers" | grep -qixF -- "$h" || { echo "::error::En-tête différent du build sur $path : ${h%%:*}"; exit 1; }
            done <<< "$expected"
            printf '%s\n' "$headers" | grep -qi '^set-cookie:' && { echo "::error::Cookie inattendu sur $path"; exit 1; }
          done
          c -I -H "Origin: $url" "https://ipoower.github.io/iPoower/race-control/obs.json" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::Données du relais non lisibles depuis l'origine dédiée (CORS)"; exit 1; }
          echo "✅ Origine dédiée : $LIVE_SHA servi (build de $SRC_SHA), octets identiques, en-têtes exacts et CORS des données vérifiés"
      - name: Données de l'origine dédiée (TWRC_DATA_BASE, flux routier en JSON et sa fraîcheur)
        if: steps.build.outputs.go == '1'
        env:
          PROJECT: ${{ vars.CLOUDFLARE_RC_PROJECT }}
        run: node tools/check-data-base.js "https://$PROJECT.pages.dev"
