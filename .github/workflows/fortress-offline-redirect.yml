name: FORTRESS - first offline start after HTTP redirect
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  redirect-offline:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'test/fortress-drive-execution-cloudflare-offline-')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/fortress-redirect-offline-browser.js
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-redirect-offline-browser
          path: fortress-redirect-offline-browser.json
          if-no-files-found: error
          retention-days: 14
