name: Race Control · rotation de RC_KEY
# TRANSITOIRE (Phase B) : supprimé au nettoyage final.
# Frontière des secrets : le SEUL code exécuté avec des secrets est celui de main (ce workflow + tools/ de main).
# La branche cible n'est jamais exécutée : elle reçoit uniquement le fichier chiffré encrypted/relay-config.sealed.json.
# Lancement : Actions → « Race Control · rotation de RC_KEY » → Run workflow (branche main) → branche cible secu/…
# Source : config chiffrée de main, vérifiée identique à la production (gh-pages), ouverte avec RC_KEY,
# rechiffrée EN MÉMOIRE avec RC_KEY_NEXT. Aucun texte clair, aucun artifact, aucune valeur dans le journal.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Branche de la pull request qui reçoit le fichier chiffré (secu/…)'
        required: true
        default: 'secu/separation-cles'
permissions:
  contents: write
concurrency:
  group: rc-key-rotation
  cancel-in-progress: false
jobs:
  rotate:
    # code de confiance uniquement : lancé depuis main, jamais depuis une autre branche
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Branche cible autorisée (secu/…, jamais main ni gh-pages)
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          case "$TARGET" in secu/*) ;; *) echo "::error::Branche cible refusée : $TARGET"; exit 1;; esac
          echo "$TARGET" | grep -Eq '^secu/[a-z0-9-]+$' || { echo "::error::Nom de branche invalide"; exit 1; }
      - name: Code de confiance = main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Configuration en production (gh-pages, chiffrée)
        run: |
          git -C trusted fetch -q --depth 1 origin gh-pages
          git -C trusted show FETCH_HEAD:race-control/relay-config.sealed.json > "$RUNNER_TEMP/prod-relay.sealed.json"
      - name: Rechiffrement RC_KEY → RC_KEY_NEXT (code de main, aucune valeur affichée)
        env:
          RC_KEY: ${{ secrets.RC_KEY }}
          RC_KEY_NEXT: ${{ secrets.RC_KEY_NEXT }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: node trusted/tools/rotate-rc-key.js --from trusted/encrypted/relay-config.sealed.json --prod "$RUNNER_TEMP/prod-relay.sealed.json" --out "$RUNNER_TEMP/rot/relay-config.sealed.json"
      # à partir d'ici : la branche cible est traitée comme des DONNÉES, jamais exécutée (aucun npm, aucun node sur ses fichiers JS)
      - name: Branche cible (données seulement)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.target }}
          path: target
      - name: Dépôt du seul fichier chiffré
        run: cp "$RUNNER_TEMP/rot/relay-config.sealed.json" target/encrypted/relay-config.sealed.json
      - name: Contrôle des clés sur la branche cible (code de main)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          RC_KEY_NEXT: ${{ secrets.RC_KEY_NEXT }}
        run: node trusted/tools/check-keys.js --enc target/encrypted
      - name: Commit sur la branche cible (un seul fichier autorisé)
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          rm -rf "$RUNNER_TEMP/rot" "$RUNNER_TEMP/prod-relay.sealed.json"
          cd target
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "Aucun changement"; exit 0; fi
          if [ "$changed" != " M encrypted/relay-config.sealed.json" ]; then echo "::error::Changement inattendu sur la branche cible"; exit 1; fi
          git config user.name "race-control-rotation"
          git config user.email "race-control-rotation@users.noreply.github.com"
          git add encrypted/relay-config.sealed.json
          git commit -q -m "Rotation RC_KEY : config du relais rechiffrée avec RC_KEY_NEXT (code de main ; source main identique à la production)"
          git push -q origin "HEAD:$TARGET"
          echo "::notice title=Rotation RC_KEY::Fichier chiffré poussé sur $TARGET. La CI de la PR doit être relancée (un commit du workflow ne la déclenche pas)."
