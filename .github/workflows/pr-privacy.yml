name: Race Control · confidentialité des pull requests
# Contrôle AVANT fusion, avec les vraies valeurs sensibles, SANS jamais exécuter le code de la pull request.
#  - pull_request_target : ce workflow et le scanner viennent TOUJOURS de main (code approuvé), jamais de la PR ;
#  - la PR est récupérée au SHA exact dans target/, sans identifiants, et lue uniquement comme des fichiers
#    (aucun node, npm, script, workflow, ni git exécuté sur target/ ; aucun lien symbolique suivi) ;
#  - les secrets ne sont donnés qu'à l'étape du scanner de main ; sortie : nom de fichier + type de donnée, jamais la valeur.
#  - uniquement pour les PR de CE dépôt : une PR venant d'un fork ne reçoit jamais ce contrôle, sinon le résultat rouge/vert
#    servirait d'oracle pour deviner une valeur privée (ex. coordonnées du domicile) en soumettant des candidats.
#  - le titre et la description de la PR sont contrôlés eux aussi (événement edited inclus) : ils arrivent par variables
#    d'environnement, sont écrits tels quels dans pr-meta/ puis lus comme données par le même scanner, jamais interpolés dans un script.
# Limite assumée : une branche poussée ou une description enregistrée est déjà publique ; ce contrôle détecte et bloque la fusion,
# la prévention reste le hook local (tools/pre-commit) et la relecture avant publication.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: pr-privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scan:
    # frontière GitHub : secrets dans l'Environment « production », accessible uniquement depuis main (règle côté GitHub,
    # indépendante de ce fichier) ; deployment: false = aucune entrée de déploiement créée
    environment:
      name: production
      deployment: false
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Scanner de confiance = main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Contenu de la PR (SHA exact, données seulement, sans identifiants)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Aucune donnée personnelle dans la PR (scanner de main, vraies valeurs)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
        run: node trusted/tools/check-secrets.js --root trusted --scan target
      - name: Titre et description de la PR (données seulement, jamais interpolées dans le script)
        # contrôlés même si le scan des fichiers est rouge : chaque fuite doit être signalée
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p pr-meta
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-meta/titre-et-description.md
      - name: Aucune donnée personnelle dans le titre ni la description (scanner de main, vraies valeurs)
        if: ${{ !cancelled() }}
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
        run: node trusted/tools/check-secrets.js --root trusted --scan pr-meta
