name: Race Control · relais météo
# Toutes les 30 min : observations réelles des stations (Albert-Bray, Amiens-Glisy) -> race-control/obs.json
# De 90 à 5 min avant le départ : verdict du trajet toutes les 15 min -> notification si orange/rouge, brouillard ou verglas,
# puis nouvelle notification uniquement en cas d'aggravation (3 par matin maximum)
on:
  schedule:
    - cron: '7,37 * * * *'
    # matin renforcé : un passage toutes les 15 min de 03:00 à 05:59 UTC (couvre l'heure d'été et d'hiver)
    - cron: '22,52 3-5 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Envoyer une notification de test maintenant (1 = oui)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relais
        env:
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
          RC_KEY: ${{ secrets.RC_KEY }}
        run: node race-control/relay.js
      - name: Publier obs.json
        run: |
          git config user.name "race-control-bot"
          git config user.email "race-control-bot@users.noreply.github.com"
          git add race-control/obs.json
          git diff --cached --quiet || (git commit -m "Observations $(date -u +%H:%M)" && git push)
