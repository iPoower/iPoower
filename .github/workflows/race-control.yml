name: Race Control · relais météo
# Toutes les 30 min : observations réelles des stations (Albert-Bray, Amiens-Glisy) -> race-control/obs.json
# Entre 05:25 et 06:15 (heure de Paris) : verdict du trajet -> notification ntfy si orange ou rouge
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Envoyer une notification de test maintenant (1 = oui)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relais
        env:
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
          RC_KEY: ${{ secrets.RC_KEY }}
        run: node race-control/relay.js
      - name: Publier obs.json
        run: |
          git config user.name "race-control-bot"
          git config user.email "race-control-bot@users.noreply.github.com"
          git add race-control/obs.json
          git diff --cached --quiet || (git commit -m "Observations $(date -u +%H:%M)" && git push)
