name: Race Control · relais météo
# Source visible dans la liste des runs : horloge (Cloudflare), manuel, schedule (cron GitHub)
run-name: "Relais · ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }}"
# Observations réelles des stations proches -> race-control/obs.json (objectif ~10 min ; tentative toutes les 5 min pour absorber les retards du scheduler GitHub)
# Horloge principale : tools/relay-clock (Cloudflare, chaque minute, garde anti-tempête, workflow_dispatch source=horloge) ; le cron GitHub ci-dessous reste un filet de secours
# De 90 à 5 min avant le départ : verdict du trajet toutes les 15 min -> notification si orange/rouge, brouillard ou verglas,
# puis nouvelle notification uniquement en cas d'aggravation (3 par matin maximum)
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Envoyer une notification de test maintenant (1 = oui)'
        default: '0'
      source:
        description: 'manuel = relais forcé ; horloge = horloge externe (tools/relay-clock), relais seulement s''il est dû'
        default: 'manuel'
# Ne pas fusionner ce changement sans la revue explicite du propriétaire.
permissions:
  contents: read
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  approved:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Révision exacte de main avec CI complète réussie (aucun secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/relay-trust.js
  relay:
    needs: approved
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Code de confiance (main exact, jamais gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Production comme données uniquement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Préparer uniquement les observations et l'agenda chiffré
        run: |
          mkdir relay-data
          node trusted/tools/relay-data.js prepare pages/race-control relay-data
      - name: Vérifier la fraîcheur sans exécuter la production
        id: fresh
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source != 'horloge' }}
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
        run: node trusted/tools/relay-data.js due relay-data 8
      - name: Relais de confiance, secrets limités à cette étape
        if: steps.fresh.outputs.due == '1'
        env:
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_RELAY_DATA: ${{ github.workspace }}/relay-data
          RC_RELAY_CONFIG_FILE: ${{ github.workspace }}/trusted/encrypted/relay-config.sealed.json
        run: node trusted/src/relay.js
      - name: Publier seulement les sorties JSON (aucun secret applicatif)
        if: steps.fresh.outputs.due == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node trusted/tools/relay-data.js publish relay-data pages/race-control
          cd pages
          git config user.name "race-control-relay"
          git config user.email "race-control-relay@users.noreply.github.com"
          git add -- race-control/obs.json
          if [ -f race-control/calendar.sealed.json ]; then git add -- race-control/calendar.sealed.json; fi
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in race-control/obs.json|race-control/calendar.sealed.json) ;; *) exit 1 ;; esac
          done
          git commit -m "Relais relay $(date -u +%H:%M)"
          # Token injecté par environnement uniquement pour le push, jamais enregistré dans un checkout.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            git -c core.hooksPath=/dev/null pull -q --rebase || exit 1
          done
          exit 1
