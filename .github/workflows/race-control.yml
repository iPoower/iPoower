name: Race Control · relais météo
# Observations réelles des stations proches -> race-control/obs.json. Avec le watchdog décalé, tentative toutes les 2–3 min ;
# GitHub peut retarder ses cron : cette cadence est un objectif de synchronisation, pas une garantie ni la cadence de mesure des stations.
# De 90 à 5 min avant le départ : verdict du trajet toutes les 15 min -> notification si orange/rouge, brouillard ou verglas,
# puis nouvelle notification uniquement en cas d'aggravation (3 par matin maximum)
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Envoyer une notification de test maintenant (1 = oui)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  relay:
    # frontière GitHub : secrets dans l'Environment « production », accessible uniquement depuis main (règle côté GitHub,
    # indépendante de ce fichier) ; deployment: false = aucune entrée de déploiement créée
    environment:
      name: production
      deployment: false
    # frontière des secrets : uniquement depuis main (jamais lancé depuis une autre branche)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Vérifier si une vraie synchronisation est due
        id: fresh
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='race-control/obs.json';
          let age=Infinity;try{const j=JSON.parse(fs.readFileSync(p,'utf8'));const t=Date.parse(j.updated),now=Date.now();if(Number.isFinite(t)&&t>0&&t<=now+60000)age=Math.max(0,(now-t)/60000);}catch(e){}
          const due=process.env.MANUAL==='true'||process.env.FORCE_PUSH==='1'||!Number.isFinite(age)||age>=2;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'due='+(due?'1':'0')+'\n');
          console.log(Number.isFinite(age)?('Dernière synchro il y a '+age.toFixed(1)+' min'): 'Aucune synchro valide',due?'→ exécuter':'→ encore fraîche, ne rien écrire');
          NODE
      - name: Relais
        if: steps.fresh.outputs.due == '1'
        env:
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
          # deux clés indépendantes : RC_KEY ouvre la config du relais, APP_KEY (code de l'app) chiffre l'agenda
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: node race-control/relay.js
      - name: Publier obs.json
        if: steps.fresh.outputs.due == '1'
        run: |
          git config user.name "race-control-bot"
          git config user.email "race-control-bot@users.noreply.github.com"
          git add race-control/obs.json; [ -f race-control/calendar.sealed.json ] && git add race-control/calendar.sealed.json
          git diff --cached --quiet || (git commit -m "Observations $(date -u +%H:%M)" && (git push || (git pull --rebase && git push)))
