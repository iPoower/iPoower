name: Race Control · température en production
on:
  push:
    branches: [verify/temperature-production]
    paths: ['tests/production-temperature-smoke.js', '.github/workflows/production-temperature-smoke.yml']
permissions:
  contents: read
jobs:
  production:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: HTML et SW publics, matrice thermique et contexte inchangé
        env:
          BROWSER: ${{ matrix.browser }}
          EXPECTED_SHA: d17c3aabe9771f24284666f1c87ddbe2cebb5803
          EXPECTED_BUILD: 350a607adb8b
          PRODUCTION_PROOF_PATH: production-proof
        run: node tests/production-temperature-smoke.js
      - name: Preuves fictives sur la vraie application publiée
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-temperature-${{ matrix.browser }}
          path: production-proof/
          if-no-files-found: error
          retention-days: 3
