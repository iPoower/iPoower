name: PR 40 · régressions ciblées
on:
  pull_request:
    types: [synchronize, labeled]
permissions:
  contents: read
concurrency:
  group: pr40-targeted
  cancel-in-progress: true
jobs:
  targeted:
    if: github.event.pull_request.number == 40 && github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'quota-ciblee') && (github.event.action != 'labeled' || github.event.label.name == 'quota-ciblee' || github.event.label.name == 'e2e53-only')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'e2e53-only') && 'e2e53-global-context.js' || 'e2e50-geolocation.js' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Préparation fictive sans tests unitaires
        run: node tests/run-ci.js --lane browser --suite "$SUITE" --prepare-only
      - name: Chromium uniquement
        run: node tests/run-ci.js --lane browser --suite "$SUITE" --reuse
      - name: WebKit après Chromium vert
        env:
          BROWSER: webkit
        run: node tests/run-ci.js --lane browser --suite "$SUITE" --reuse
      - name: Erreurs complètes des seuls tests ciblés
        if: failure()
        run: find .ci/work -name "$SUITE.log" -o -name "${SUITE%.js}.log" | xargs -r cat
      - name: Rapports ciblés (aucun verdict de suite complète)
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr40-targeted-results
          path: .ci/results/report-*.json
          if-no-files-found: ignore
          retention-days: 14
