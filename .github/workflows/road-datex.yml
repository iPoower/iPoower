name: Race Control · DATEX routier
on:
  push:
    branches: [main]
    paths: ['tools/road-datex/**', '.github/workflows/road-datex.yml']
  schedule:
    - cron: '4,12,20,28,36,44,52 * * * *'
  # Le cron GitHub peut manquer des exécutions. L'horloge externe existante
  # déclenche le relais météo ; sa fin renouvelle aussi le flux DATEX public.
  # Une panne météo ne doit pas bloquer cette ingestion indépendante.
  workflow_run:
    workflows: ['Race Control · relais météo', 'Race Control · watchdog relais']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# File distincte du relais météo : une file GitHub ne garde qu'une exécution en attente,
# DATEX ne doit jamais remplacer (annuler) une exécution météo en attente.
concurrency:
  group: race-control-datex
  cancel-in-progress: false
jobs:
  datex:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
      - name: Normaliser le flux public (aucun secret, aucune donnée utilisateur)
        run: python3 tools/road-datex/sync.py --output pages/race-control/road-datex.json
      - name: Publier uniquement les événements publics
        working-directory: pages
        run: |
          git config user.name "race-control-datex"
          git config user.email "race-control-datex@users.noreply.github.com"
          git add race-control/road-datex.json
          git diff --cached --quiet && exit 0
          git commit -q -m "DATEX : événements DIR actualisés"
          for i in 1 2 3 4 5; do
            if git push -q; then exit 0; fi
            git pull -q --rebase || exit 1
          done
          exit 1
