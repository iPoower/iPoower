name: Race Control · tests
# Chaque modification est vérifiée avant tout déploiement.
#  - version : en retour arrière (lancement manuel), vérifie que l'étiquette prod-N demandée existe.
#  - confidentialite : seul job qui reçoit les vrais secrets, uniquement pour vérifier qu'aucune donnée réelle n'est publiée.
#    Vérifie aussi la séparation des clés (APP_KEY : préréglage, RC_KEY : config du relais ; jamais l'une pour l'autre).
#    Frontière des secrets : il ne tourne JAMAIS sur une pull request, seulement sur du code déjà fusionné dans main
#    (push sur main, ou retour arrière lancé depuis main). Les PR sont testées avec des données et des clés fictives.
#    Avant fusion, les données personnelles d'une PR sont cherchées par pr-privacy.yml (scanner de main, PR lue comme données).
#    Aucun navigateur, aucun build de l'app, aucun affichage de donnée.
#  - unit + tests : AUCUN secret. L'app est construite avec un préréglage, un agenda et deux clés distinctes 100 % fictifs, puis testée
#    Unitaires une fois, E2E Chromium et WebKit (profil iPhone) en 3 shards chacun, réseau extérieur bloqué.
#  - validation : verdict unique ; chaque contrôle, chaque shard et chaque suite applicable doivent être présents et verts.
#  - relay-smoke : AUCUN secret. Le vrai relay.js tourne sur une configuration, un agenda et une géographie fictifs
#    (alerte du matin, absence de doublon, télétravail, agenda chiffré avec tracés, obs.json sans donnée de trajet,
#    séparation des clés, garde-fou RC_KEY ≠ APP_KEY).
#  - deploy : seulement si confidentialite, relay-smoke ET validation sont verts, pour un push sur main ou un retour arrière.
#    Publie le build sur gh-pages sans jamais toucher aux fichiers du relais, étiquette la version (prod-N), vérifie la version en ligne.
#    Un déploiement commencé n'est jamais annulé.
# Retour arrière : Actions → « Race Control · tests » → Run workflow → version = prod-N. C'est un NOUVEAU déploiement contrôlé
# de l'ancien code (mêmes contrôles, mêmes tests), jamais un reset de gh-pages : les données fraîches du relais sont conservées.
# Aucune capture ni sortie brute n'est publiée : le dépôt est public.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'tests/**', 'encrypted/**', 'package.json', 'package-lock.json', '.github/workflows/ci.yml', '.github/workflows/race-control.yml', '.github/workflows/race-control-watchdog.yml', '.github/workflows/road-datex.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Retour arrière : étiquette à redéployer (ex. prod-7). Laisser vide pour seulement tester main.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          WANT: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WANT" ]; then echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$WANT" in prod-[0-9]*) ;; *) echo "::error::Version invalide : $WANT (attendu prod-N)"; exit 1;; esac
          sha=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/$WANT" | cut -f1)
          if [ -z "$sha" ]; then echo "::error::L'étiquette $WANT n'existe pas"; exit 1; fi
          echo "Retour arrière vers $WANT ($sha)"; echo "ref=$sha" >> "$GITHUB_OUTPUT"
  confidentialite:
    needs: version
    # frontière GitHub : secrets dans l'Environment « production », accessible uniquement depuis main (règle côté GitHub,
    # indépendante de ce fichier) ; deployment: false = aucune entrée de déploiement créée
    environment:
      name: production
      deployment: false
    # frontière des secrets : jamais sur une pull request (son code n'est pas encore approuvé).
    # Uniquement sur main (push après fusion) ou un retour arrière lancé depuis main (étiquette prod-N = ancien code de main).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Aucune donnée personnelle dans le dépôt
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
        run: node tools/check-secrets.js
      - name: Séparation des clés (APP_KEY ≠ RC_KEY, chacune n'ouvre que ses fichiers)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
        run: node tools/check-keys.js
  unit:
    needs: version
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Dépendances exactes (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Syntaxe et scanner sans secrets
        run: |
          node tests/ci/syntax.js
          node tools/check-secrets.js
      - name: Unitaires, contre-tests et préparation fictive unique
        run: node tests/run-ci.js --lane unit
      - name: Build et agenda fictifs partagés (aucune clé dans cet artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fixtures
          path: .ci/prepared/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: true
          retention-days: 1
      - name: Rapport unitaire et durées (aucune sortie brute)
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-unit
          path: .ci/results/report-unit.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  tests:
    needs: [version, unit]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Chaque job a son navigateur, son runner et son workspace. Aucun shard n'annule un autre shard.
    concurrency:
      group: ci-tests-${{ github.ref }}-${{ matrix.browser }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Dépendances exactes (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Navigateur ${{ matrix.browser }}
        # Installation bornée et relancée : le 7 octobre, elle s'est bloquée plus de 20 min (dépôts apt / téléchargement),
        # deux jobs WebKit ont expiré à 30 min sans exécuter un seul test. 3 essais de 6 min au plus, puis échec explicite.
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning title=Navigateur ${{ matrix.browser }}::installation bloquée ou en échec (essai $i/3), nouvelle tentative"
            sleep $((i * 10))
          done
          echo "::error title=Navigateur ${{ matrix.browser }}::installation impossible après 3 essais"; exit 1
      - name: Fixtures fictives du même run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-fixtures
          path: .ci/prepared
          digest-mismatch: error
      - name: E2E complets du shard ${{ matrix.shard }}/3
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/run-ci.js --lane browser --shard ${{ matrix.shard }}/3 --reuse
      - name: Rapport du shard et durées (aucune sortie brute)
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: .ci/results/report-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Captures du lieu compact (fixtures fictives uniquement)
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: place-qa-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            .ci/work/*/out/place-*.png
            .ci/work/*/out/place-*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  tests-rollback:
    needs: version
    # Les anciens tags n'ont pas les helpers de sharding : conserver leur runner intégral.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # seuls les tests d'une modification remplacée par une plus récente sont annulés (jamais un déploiement)
    concurrency:
      group: ci-rollback-${{ github.ref }}-${{ github.event.inputs.version }}-${{ matrix.browser }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Dépendances exactes (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Navigateur ${{ matrix.browser }}
        # Installation bornée et relancée : le 7 octobre, elle s'est bloquée plus de 20 min (dépôts apt / téléchargement),
        # deux jobs WebKit ont expiré à 30 min sans exécuter un seul test. 3 essais de 6 min au plus, puis échec explicite.
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning title=Navigateur ${{ matrix.browser }}::installation bloquée ou en échec (essai $i/3), nouvelle tentative"
            sleep $((i * 10))
          done
          echo "::error title=Navigateur ${{ matrix.browser }}::installation impossible après 3 essais"; exit 1
      - name: Tests (données fictives, sans aucun secret)
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/run-ci.js
  relay-smoke:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Relais de bout en bout (données fictives, sans aucun secret)
        run: node tests/relay-smoke.js
      - name: "Outils de clés : contrôle de séparation (clés fictives, sans aucun secret)"
        run: node tests/keys-tools.js
      - name: "Confidentialité des PR : scanner de confiance, PR lue comme données (fictif, sans aucun secret)"
        run: node tests/pr-privacy.js
  validation:
    needs: [version, unit, tests, tests-rollback, relay-smoke, confidentialite]
    # Même en cas d'échec d'un parent, le verdict doit être rouge, jamais sauté en silence.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
      CI_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
      CI_PRODUCTION: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.version != '') }}
    steps:
      # Sur rollback, le vérificateur vient du workflow actuel, pas de l'ancien tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Tous les contrôles requis doivent être verts
        run: node tests/ci/verify-results.js --gates-only
      - name: Rassembler tous les rapports du même run
        if: env.CI_ROLLBACK != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-results-*
          path: .ci/all-results
          merge-multiple: true
          digest-mismatch: error
      - name: Couverture exacte et timings des sept lanes
        if: env.CI_ROLLBACK != 'true'
        run: node tests/ci/verify-results.js .ci/all-results
      - name: Retour arrière validé par les suites historiques complètes
        if: env.CI_ROLLBACK == 'true'
        run: echo 'Retour arrière validé sur Chromium et WebKit, avec confidentialité et relay-smoke. Le runner historique du tag reste intégral ; son timing peut dépasser celui de la nouvelle CI.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: [version, confidentialite, validation, relay-smoke]
    # Le verdict gère les skips attendus de rollback ; aucune dépendance échouée ne permet de publier.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.confidentialite.result == 'success' && needs.validation.result == 'success' && needs.relay-smoke.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: race-control-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Build de production (réglages déjà chiffrés, aucun secret)
        run: node tools/build.js
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
      - name: Publier sur gh-pages
        id: pub
        env:
          ROLLBACK: ${{ github.event.inputs.version }}
          SRC_SHA: ${{ needs.version.outputs.ref }}
        run: |
          if [ -n "$ROLLBACK" ]; then N="${ROLLBACK#prod-}"; MSG="Retour arrière vers $ROLLBACK (${SRC_SHA::7}, tests verts, run ${{ github.run_number }})";
          else
            # numérotation continue : dernière étiquette prod-N + 1 (les exécutions de pull requests ne consomment plus de numéro)
            LAST=$(git ls-remote --tags origin 'refs/tags/prod-*' | sed -E 's#.*refs/tags/prod-([0-9]+)$#\1#' | grep -E '^[0-9]+$' | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 )); MSG="Déploiement prod-$N : ${SRC_SHA::7} (tests verts, run ${{ github.run_number }})"
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          DEPLOY_RUN="$N" DEPLOY_SHA="$SRC_SHA" DEPLOY_ROLLBACK="$ROLLBACK" node tools/deploy-copy.js dist pages/race-control
          cd pages
          git config user.name "race-control-deploy"
          git config user.email "race-control-deploy@users.noreply.github.com"
          git add race-control
          if git diff --cached --quiet; then echo "Production déjà à jour"; echo "done=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do git push -q && break; sleep 3; git pull -q --rebase; done
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Étiquette de version (point de retour arrière)
        if: steps.pub.outputs.done == '1' && github.event.inputs.version == ''
        run: |
          git tag "prod-${{ steps.pub.outputs.n }}" "$GITHUB_SHA"
          git push -q origin "prod-${{ steps.pub.outputs.n }}"
      - name: Vérification de la version en ligne
        if: steps.pub.outputs.done == '1'
        run: |
          want=$(sha256sum dist/index.html | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://ipoower.github.io/iPoower/race-control/index.html?v=${GITHUB_RUN_ID}$i" | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then echo "✅ Version en ligne identique au build"; exit 0; fi
            sleep 20
          done
          echo "::error::La version en ligne ne correspond pas au build après 10 minutes"; exit 1
