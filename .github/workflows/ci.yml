name: Race Control · tests
# Chaque modification est vérifiée avant tout déploiement.
#  - version : en retour arrière (lancement manuel), vérifie que l'étiquette prod-N demandée existe.
#  - confidentialite : seul job qui reçoit les vrais secrets, uniquement pour vérifier qu'aucune donnée réelle n'est publiée.
#    Frontière des secrets : il ne tourne JAMAIS sur une pull request, seulement sur du code déjà fusionné dans main
#    (push sur main, ou retour arrière lancé depuis main). Les PR sont testées avec des données et des clés fictives.
#    Avant fusion, les données personnelles d'une PR sont cherchées par pr-privacy.yml (scanner de main, PR lue comme données).
#    Aucun navigateur, aucun build de l'app, aucun affichage de donnée.
#  - tests : AUCUN secret. L'app est construite avec un préréglage, un agenda et une clé 100 % fictifs, puis testée
#    sur Chromium et sur WebKit (moteur de Safari, profil iPhone), réseau extérieur bloqué.
#  - relay-smoke : AUCUN secret. Le vrai relay.js tourne sur une configuration, un agenda et une géographie fictifs
#    (alerte du matin, absence de doublon, télétravail, agenda chiffré avec tracés, obs.json sans donnée de trajet).
#  - deploy : seulement si confidentialite, relay-smoke ET les deux navigateurs sont verts, pour un push sur main ou un retour arrière.
#    Publie le build sur gh-pages sans jamais toucher aux fichiers du relais, étiquette la version (prod-N), vérifie la version en ligne.
#    Un déploiement commencé n'est jamais annulé.
# Retour arrière : Actions → « Race Control · tests » → Run workflow → version = prod-N. C'est un NOUVEAU déploiement contrôlé
# de l'ancien code (mêmes contrôles, mêmes tests), jamais un reset de gh-pages : les données fraîches du relais sont conservées.
# Aucune capture ni sortie brute n'est publiée : le dépôt est public.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'tests/**', 'encrypted/**', 'package.json', 'package-lock.json', '.github/workflows/ci.yml', '.github/workflows/race-control.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Retour arrière : étiquette à redéployer (ex. prod-7). Laisser vide pour seulement tester main.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          WANT: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WANT" ]; then echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$WANT" in prod-[0-9]*) ;; *) echo "::error::Version invalide : $WANT (attendu prod-N)"; exit 1;; esac
          sha=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/$WANT" | cut -f1)
          if [ -z "$sha" ]; then echo "::error::L'étiquette $WANT n'existe pas"; exit 1; fi
          echo "Retour arrière vers $WANT ($sha)"; echo "ref=$sha" >> "$GITHUB_OUTPUT"
  confidentialite:
    needs: version
    # frontière des secrets : jamais sur une pull request (son code n'est pas encore approuvé).
    # Uniquement sur main (push après fusion) ou un retour arrière lancé depuis main (étiquette prod-N = ancien code de main).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Aucune donnée personnelle dans le dépôt
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
        run: node tools/check-secrets.js
  tests:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # seuls les tests d'une modification remplacée par une plus récente sont annulés (jamais un déploiement)
    concurrency:
      group: ci-tests-${{ github.ref }}-${{ github.event.inputs.version }}-${{ matrix.browser }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Dépendances exactes (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Navigateur ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Tests (données fictives, sans aucun secret)
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/run-ci.js
  relay-smoke:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Relais de bout en bout (données fictives, sans aucun secret)
        run: node tests/relay-smoke.js
      - name: "Outils de clés : rotation et contrôle de séparation (clés fictives, sans aucun secret)"
        run: node tests/keys-tools.js
      - name: "Confidentialité des PR : scanner de confiance, PR lue comme données (fictif, sans aucun secret)"
        run: node tests/pr-privacy.js
  deploy:
    needs: [version, confidentialite, tests, relay-smoke]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: race-control-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build de production (réglages déjà chiffrés, aucun secret)
        run: node tools/build.js
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - name: Publier sur gh-pages
        id: pub
        env:
          ROLLBACK: ${{ github.event.inputs.version }}
          SRC_SHA: ${{ needs.version.outputs.ref }}
        run: |
          if [ -n "$ROLLBACK" ]; then N="${ROLLBACK#prod-}"; MSG="Retour arrière vers $ROLLBACK (${SRC_SHA::7}, tests verts, run ${{ github.run_number }})";
          else
            # numérotation continue : dernière étiquette prod-N + 1 (les exécutions de pull requests ne consomment plus de numéro)
            LAST=$(git ls-remote --tags origin 'refs/tags/prod-*' | sed -E 's#.*refs/tags/prod-([0-9]+)$#\1#' | grep -E '^[0-9]+$' | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 )); MSG="Déploiement prod-$N : ${SRC_SHA::7} (tests verts, run ${{ github.run_number }})"
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          DEPLOY_RUN="$N" DEPLOY_SHA="$SRC_SHA" DEPLOY_ROLLBACK="$ROLLBACK" node tools/deploy-copy.js dist pages/race-control
          cd pages
          git config user.name "race-control-deploy"
          git config user.email "race-control-deploy@users.noreply.github.com"
          git add race-control
          if git diff --cached --quiet; then echo "Production déjà à jour"; echo "done=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do git push -q && break; sleep 3; git pull -q --rebase; done
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Étiquette de version (point de retour arrière)
        if: steps.pub.outputs.done == '1' && github.event.inputs.version == ''
        run: |
          git tag "prod-${{ steps.pub.outputs.n }}" "$GITHUB_SHA"
          git push -q origin "prod-${{ steps.pub.outputs.n }}"
      - name: Vérification de la version en ligne
        if: steps.pub.outputs.done == '1'
        run: |
          want=$(sha256sum dist/index.html | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://ipoower.github.io/iPoower/race-control/index.html?v=${GITHUB_RUN_ID}$i" | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then echo "✅ Version en ligne identique au build"; exit 0; fi
            sleep 20
          done
          echo "::error::La version en ligne ne correspond pas au build après 10 minutes"; exit 1
