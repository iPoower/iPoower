name: Race Control · watchdog relais
# Second filet de sécurité dans GitHub Actions. Il ne garantit pas une horloge stricte (le scheduler GitHub peut retarder/supprimer des runs),
# mais multiplie les occasions de rattrapage et vérifie aussi la fraîcheur à chaque push sur main. Il conserve les anti-doublons du relais.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  watchdog:
    environment:
      name: production
      deployment: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
      - name: Mesurer l’âge du dernier relais
        id: stale
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='race-control/obs.json';
          let age=Infinity;try{const j=JSON.parse(fs.readFileSync(p,'utf8'));const t=Date.parse(j.updated);if(Number.isFinite(t))age=(Date.now()-t)/60000;}catch(e){}
          const due=!Number.isFinite(age)||age>=10;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'due='+(due?'1':'0')+'\n');
          console.log(Number.isFinite(age)?('Dernier relais : '+age.toFixed(1)+' min'): 'Dernier relais illisible',due?'→ rattrapage':'→ OK');
          NODE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.stale.outputs.due == '1'
        with:
          node-version: 24
      - name: Rattraper le relais
        if: steps.stale.outputs.due == '1'
        env:
          FORCE_PUSH: '0'
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: node race-control/relay.js
      - name: Publier le rattrapage
        if: steps.stale.outputs.due == '1'
        run: |
          git config user.name "race-control-watchdog"
          git config user.email "race-control-watchdog@users.noreply.github.com"
          git add race-control/obs.json; [ -f race-control/calendar.sealed.json ] && git add race-control/calendar.sealed.json
          git diff --cached --quiet && exit 0
          git commit -m "Relais watchdog $(date -u +%H:%M)"
          # DATEX publie dans sa propre file : plusieurs écrivains peuvent pousser gh-pages en même temps
          for i in 1 2 3 4 5; do git push && exit 0; sleep "$i"; git pull -q --rebase || exit 1; done
          exit 1
