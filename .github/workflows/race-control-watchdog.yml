name: Race Control · watchdog relais
# Second filet de sécurité dans GitHub Actions. Il ne garantit pas une horloge stricte (le scheduler GitHub peut retarder/supprimer des runs),
# mais multiplie les occasions de rattrapage et vérifie aussi la fraîcheur à chaque push sur main. Il conserve les anti-doublons du relais.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
# Ne pas fusionner ce changement sans la revue explicite du propriétaire.
permissions:
  contents: read
concurrency:
  group: race-control-relay
  cancel-in-progress: false
jobs:
  approved:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      state: ${{ steps.trust.outputs.state }}
      sha: ${{ steps.trust.outputs.sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Révision exacte de main et état CI (aucun secret, attente contrôlée)
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/relay-trust.js --defer-pending
  watchdog:
    needs: approved
    if: github.ref == 'refs/heads/main' && needs.approved.outputs.state == 'approved'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Code de confiance (main exact, jamais gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.approved.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Production comme données uniquement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Préparer uniquement les observations et l'agenda chiffré
        run: |
          mkdir relay-data
          node trusted/tools/relay-data.js prepare pages/race-control relay-data
      - name: Vérifier la fraîcheur sans exécuter la production
        id: fresh
        env:
          MANUAL: 'false'
          FORCE_PUSH: '0'
        run: node trusted/tools/relay-data.js due relay-data 10
      - name: Revalider main et la dernière CI juste avant les secrets
        if: steps.fresh.outputs.due == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_APPROVED_SHA: ${{ needs.approved.outputs.sha }}
        run: node trusted/tools/relay-trust.js --recheck-approved
      - name: Relais de confiance, secrets limités à cette étape
        if: steps.fresh.outputs.due == '1'
        env:
          FORCE_PUSH: '0'
          RC_KEY: ${{ secrets.RC_KEY }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          APP_KEY: ${{ secrets.APP_KEY }}
          RC_RELAY_DATA: ${{ github.workspace }}/relay-data
          RC_RELAY_CONFIG_FILE: ${{ github.workspace }}/trusted/encrypted/relay-config.sealed.json
        run: node trusted/src/relay.js
      - name: Publier seulement les sorties JSON (aucun secret applicatif)
        if: steps.fresh.outputs.due == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node trusted/tools/relay-data.js publish relay-data pages/race-control
          cd pages
          git config user.name "race-control-watchdog"
          git config user.email "race-control-watchdog@users.noreply.github.com"
          git add -- race-control/obs.json
          if [ -f race-control/calendar.sealed.json ]; then git add -- race-control/calendar.sealed.json; fi
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in race-control/obs.json|race-control/calendar.sealed.json) ;; *) exit 1 ;; esac
          done
          git commit -m "Relais watchdog $(date -u +%H:%M)"
          # Token injecté par environnement uniquement pour le push, jamais enregistré dans un checkout.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            git -c core.hooksPath=/dev/null pull -q --rebase || exit 1
          done
          exit 1
