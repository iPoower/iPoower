name: Temperature card · targeted validation
on:
  push:
    branches: [ui/weather-temperature-card-dark]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/run-ci.js --prepare-only
      - name: Météo, matrice température et layout iPhone/desktop
        env:
          BROWSER: ${{ matrix.browser }}
          TEMPERATURE_SHOTS: ${{ github.workspace }}/.ci/temperature-shots
        run: |
          node tests/run-ci.js --lane browser --reuse --suite e2e42-meteo.js --suite e2e39-layout.js
      - name: Logs ciblés fictifs
        if: always()
        run: cat .ci/work/*/out/e2e42-meteo.log .ci/work/*/out/e2e39-layout.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: temperature-${{ matrix.browser }}
          path: .ci/temperature-shots/
          if-no-files-found: warn
          retention-days: 3
