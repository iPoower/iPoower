name: Race Control · contrôle de la production
on:
  push:
    branches: [verify/production-integration]
permissions:
  contents: read
jobs:
  production:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build public, SW réel, quatre vues et cycle de localisation
        env:
          BROWSER: ${{ matrix.browser }}
          EXPECTED_SHA: 1d6109d8e4d81823cb6b7f328f93e0e141809cab
          EXPECTED_BUILD: 82854ced8e89
        run: node tests/production-integration-smoke.js
