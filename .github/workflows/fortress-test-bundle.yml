name: FORTRESS TEST - attested synthetic bundle
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: fortress-bundle-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL TEST exact HEAD (no upload)
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'test/fortress-drive-execution-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          upload: never
          output: .ci/codeql
      - name: Refuse error or warning findings
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const files = fs.readdirSync('.ci/codeql').filter(n => n.endsWith('.sarif'));
          if (!files.length) throw Error('No CodeQL proof');
          let blocking = 0;
          for (const file of files) for (const run of JSON.parse(fs.readFileSync('.ci/codeql/' + file)).runs) {
            const rules = new Map((run.tool.driver.rules || []).map(r => [r.id, r]));
            for (const r of run.results || []) {
              const level = r.level || rules.get(r.ruleId)?.defaultConfiguration?.level || 'warning';
              if (['error', 'warning'].includes(level)) blocking++;
            }
          }
          if (blocking) throw Error(blocking + ' CodeQL findings require review');
          console.log('CodeQL: no error/warning finding');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fortress-codeql-${{ github.event.pull_request.head.sha }}
          path: .ci/codeql/*.sarif
          if-no-files-found: error
          retention-days: 14
  bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'test/fortress-drive-execution-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head, never merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - id: verify
        name: Build fake-only TEST and verify every SHA-256
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          FORTRESS_TEST_GOOGLE_CONFIG: ${{ vars.FORTRESS_TEST_GOOGLE_CONFIG }}
          GOOGLE_DRIVE_CONFIG: ${{ vars.FORTRESS_TEST_GOOGLE_CONFIG }}
        run: |
          node tools/build-drive-test.cjs > "$RUNNER_TEMP/fortress-build-receipt.json"
          node scripts/verify-fortress-artifact.mjs "$RUNNER_TEMP/fortress-build-receipt.json"
      - name: Upload verified synthetic TEST bundle only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-race-control-test-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.verify.outputs.site_dir }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

# No deploy, secrets, production environments, real data, OAuth or real Drive calls.
