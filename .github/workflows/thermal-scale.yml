name: Race Control · barème thermique ciblé
on:
  push:
    branches: [verify/temperature-scale]
permissions:
  contents: read
jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Barème, météo et layout iPhone
        env:
          BROWSER: ${{ matrix.browser }}
          TEMPERATURE_SHOTS: ${{ github.workspace }}/temperature-proof
        run: node tests/run-ci.js --lane browser --suite e2e42-meteo.js --suite e2e39-layout.js
      - name: Captures et mesures exclusivement fictives
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thermal-scale-${{ matrix.browser }}
          path: |
            temperature-proof/
            .ci/results/report-*.json
          if-no-files-found: error
          retention-days: 3
