name: FORTRESS - exact published candidate acceptance
on:
  pull_request:
    branches: [audit/fortress-final-acceptance-20261026]
    paths:
      - .github/workflows/fortress-candidate-acceptance.yml
      - tests/fortress-candidate-acceptance.js
permissions:
  contents: read
jobs:
  native-proxy-selftest:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/fortress-candidate-acceptance.js --self-test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-proxy-selftest
          path: fortress-proxy-selftest.json
          if-no-files-found: error
          retention-days: 14
  exact-published-candidates:
    needs: native-proxy-selftest
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact manifests, all file bytes, headers, native offline and restart
        run: node tests/fortress-candidate-acceptance.js
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-candidate-proof
          path: fortress-candidate-proof.json
          if-no-files-found: error
          retention-days: 14
